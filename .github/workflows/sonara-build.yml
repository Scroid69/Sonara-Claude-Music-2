name: Sonara - test and build APK

# Run it from the Actions tab (Run workflow) or push to main.
# It runs the unit tests first, then builds a debug-signed APK that installs on any phone with no
# signing keys or secrets, and publishes it as a GitHub Release (and as a run artifact).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Enable the full build flavour
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties
          touch ./local.properties

      - name: Unit tests (mix planner, peak fusion, curves, boost DSP, mix builder)
        run: ./gradlew :domain:jvmTest :kotlinYtmusicScraper:jvmTest --console=plain

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug --console=plain

      - name: Collect the APK
        run: |
          mkdir -p out
          find androidApp/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: sonara-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sonara-${{ github.run_number }}
          name: Sonara build ${{ github.run_number }}
          body: Debug-signed build. Install the arm64 APK on most phones. See SONARA.md for what to test.
          files: out/*.apk
